
name: Gerar APK QualiInsp

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar arquivos do projeto
        run: |
          echo "Verificando estrutura..."
          test -f settings.gradle.kts || test -f configurações.gradle.kts
          test -d app || test -d aplicativo
          find . -maxdepth 4 -name "build.gradle.kts" -print

      - name: Compilar APK de depuração
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "ERRO: arquivo gradlew não encontrado na raiz."
            exit 1
          fi

      - name: Localizar APK gerado
        run: |
          find . -type f -name "*.apk" -print
          test -n "$(find . -type f -name '*.apk' -print -quit)"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: QualiInsp-APK-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
